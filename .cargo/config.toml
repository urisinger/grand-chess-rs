[build]
rustflags = ["-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=mold", "-Zthreads=0"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=mold", "-Zthreads=0"]

[alias]
build-native = [
  "build",
  "--config",
  "build.rustflags=[\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.x86_64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=mold\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.aarch64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=mold\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
]
run-native = [
  "run",
  "--config",
  "build.rustflags=[\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.x86_64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=mold\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.aarch64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=mold\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
]

[env]
EVALFILE="nn-62ef826d1a6d.nnue"
